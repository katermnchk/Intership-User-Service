spring:
  application:
    name: InnowiseUserService

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/main-changelog.xml

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: "health,liveness,readiness"
  endpoint:
    health:
      probes:
        enabled: true

app:
  api:
    base-path: /api/v1
  auth-service:
    validate-url: ${AUTH_SERVICE_VALIDATE_URL:http://auth-service:8080/api/v1/auth/validate}

internal:
  api:
    header-name: "Internal-Service-Secret"
    secret: ${INTERNAL_API_SECRET}

server:
  port: ${SERVER_PORT:8081}