spring:
  application:
    name: InnowiseUserService

  datasource:
    url: ${INNOWISE_USER_SERVICE_DATASOURCE_URL}
    username: ${INNOWISE_USER_SERVICE_USERNAME}
    password: ${INNOWISE_USER_SERVICE_PASSWORD}

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/main-changelog.xml

app:
  api:
    base-path: /api/v1