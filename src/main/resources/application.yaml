spring:
  application:
    name: InnowiseUserService

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/main-changelog.xml

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

app:
  api:
    base-path: /api/v1
  auth-service:
    validate-url: ${AUTH_SERVICE_VALIDATE_URL:http://innowise-auth-service:9090/api/v1/auth/validate}
